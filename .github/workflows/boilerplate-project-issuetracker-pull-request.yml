name: Build on PR

on:
  push:
    branches-ignore:
    - master
  pull_request:
    branches-ignore:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install Jest
        run: yarn && yarn add jest --dev
